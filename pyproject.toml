[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nhlv"
version = "0.1.0"
description = "Command-line NHL scores, standings, and schedules"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wonchang" }]
dependencies = ["requests>=2.28"]
keywords = ["nhl", "hockey", "scores", "standings", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nhlv = "nhlv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nhlv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
